name: Something's not working
description: A conversion fails, a screen looks wrong, or Morf crashes.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Paste the error Morf showed, if any.
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: The file
      description: Its type and roughly how big, e.g. "a 2 GB .mov from an iPhone 15". Please don't attach private files.
  - type: input
    id: version
    attributes:
      label: Morf version and system
      description: Settings → About shows the version. e.g. "0.1.0, Windows 11 24H2"
    validations:
      required: true
