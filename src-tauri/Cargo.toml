[package]
name = "morf"
version = "0.1.0"
description = "Morf: convert, compress and count, all on your computer."
authors = ["Morf contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/giancoferrari/morf"
edition = "2024"
rust-version = "1.90"

[lib]
name = "morf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time", "fs"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico", "webp", "rayon"] }
jpeg-encoder = "0.7"
oxipng = { version = "10", default-features = false, features = ["parallel"] }
imagequant = { version = "4", default-features = false, features = ["threads"] }
webp = { version = "0.3", default-features = false }
lopdf = { version = "0.47", default-features = false }
flate2 = "1"
trash = "5"
dirs = "7"
which = "8"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
panic = "abort"

# Image codecs are painfully slow unoptimised; keep them fast in debug builds too.
[profile.dev.package."*"]
opt-level = 3
